[project]
name = "4ucar"
version = "0.1.0"
description = "UCAR Intelligent University ERP — backend monorepo"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # --- Web framework ---
    "fastapi",
    "uvicorn[standard]",
    "gunicorn",
    "python-multipart",
    "httpx",
    "aiofiles",
    # --- Settings & validation ---
    "pydantic",
    "pydantic-settings",
    # --- Database ---
    "sqlalchemy",
    "asyncpg",
    "psycopg[binary]",
    "aiosqlite",           # test in-memory DB
    "alembic",
    # --- Cache / queue / pubsub ---
    "redis",
    "celery",
    # --- Object storage & search ---
    "minio",
    "elasticsearch",
    # --- Auth ---
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    # --- Document ingestion ---
    "pymupdf",             # PyMuPDF — native PDF extraction + page rendering
    "openpyxl",            # Excel .xlsx read/write
    "chardet",             # CSV encoding detection
    "Pillow",              # image pre-processing before OCR
    # --- OCR (PaddleOCR PP-StructureV2) ---
    # CPU-only builds; pinned to avoid torch dependency via albumentations>=2.x
    "paddlepaddle==2.6.2",
    "paddleocr<3.0.0",
    "albumentations==1.3.1",
    # --- General document / data ---
    "pandas",
    "tabula-py",
    "python-docx",
    # --- ML / NLP ---
    "scikit-learn",
    "numpy",
    "shap",
    "sentence-transformers",
    # --- AI / Claude API ---
    "anthropic",
    "tenacity",            # retry logic for Claude API calls + other integrations
    # --- Report generation ---
    "weasyprint",
    "jinja2",
    # --- Observability ---
    "structlog",
    "prometheus-fastapi-instrumentator",
    "sentry-sdk",
    # --- Utilities ---
    "email-validator",
    "babel",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "anyio[trio]",
    "ruff",
    "mypy",
    "pre-commit",
    "types-passlib",
    "types-python-jose",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
