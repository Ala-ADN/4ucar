# Garage v1.x — single-node dev config.
# Production overrides should pin a specific image tag, raise replication_factor,
# and supply secrets via a real secret store rather than .env.example.
#
# First-run setup (after `docker compose up -d garage`):
#   docker compose exec garage /garage status
#   docker compose exec garage /garage layout assign -z dc1 -c 1G <node_id>
#   docker compose exec garage /garage layout apply --version 1
#   docker compose exec garage /garage bucket create docs
#   docker compose exec garage /garage key create app-key
#   docker compose exec garage /garage bucket allow --read --write --owner docs --key app-key
# Copy the generated key id/secret into S3_ACCESS_KEY / S3_SECRET_KEY in .env.example.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.local"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.local"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
