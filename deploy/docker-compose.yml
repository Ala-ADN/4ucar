# Local development stack. Image tags intentionally use `latest` so versions
# are resolved by `docker compose pull`; pin in production overrides only.

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    env_file: .env.example
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  garage:
    image: dxflrs/garage:latest
    env_file: .env.example
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"  # S3 API
      - "3902:3902"  # S3 web (static hosting)
      - "3903:3903"  # admin API

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:latest
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  gateway:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - garage
      - elasticsearch

  auth-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.auth_service.main:app --host 0.0.0.0 --port 8001
    depends_on: [postgres, redis, keycloak]

  kpi-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.kpi_service.main:app --host 0.0.0.0 --port 8002
    depends_on: [postgres, redis]

  doc-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.doc_service.main:app --host 0.0.0.0 --port 8003
    depends_on: [postgres, redis, garage, elasticsearch]

  hr-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.hr_service.main:app --host 0.0.0.0 --port 8004
    depends_on: [postgres, redis]

  project-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.project_service.main:app --host 0.0.0.0 --port 8005
    depends_on: [postgres, redis]

  alert-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.alert_service.main:app --host 0.0.0.0 --port 8006
    depends_on: [postgres, redis]

  nlp-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.nlp_service.main:app --host 0.0.0.0 --port 8007
    depends_on: [elasticsearch, redis]

  report-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.report_service.main:app --host 0.0.0.0 --port 8008
    depends_on: [postgres, garage]

  admin-service:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file: .env.example
    command: uvicorn backend.services.admin_service.main:app --host 0.0.0.0 --port 8009
    depends_on: [postgres, redis]

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    env_file: .env.example
    command: celery -A backend.workers.celery_app worker -l INFO
    depends_on: [postgres, redis, garage, elasticsearch]

  beat:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    env_file: .env.example
    command: celery -A backend.workers.celery_app beat -l INFO
    depends_on: [redis]

volumes:
  pgdata:
  garage_meta:
  garage_data:
